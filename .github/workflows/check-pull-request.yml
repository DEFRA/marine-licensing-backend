name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - feature/**
      - ML-*
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci
          npm run format:check
          npm run lint
          npm test
      - name: Security audit
        run: npm audit --audit-level=high || (echo 'Vulnerabilities found!' && exit 1)

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-backend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 #v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-journey:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          fetch-depth: 0
      - name: Select journey test profile
        id: journey-profile
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "profile=smoke" >> "$GITHUB_OUTPUT"
            echo "Dependabot PR detected — running smoke journey tests only"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            echo "Changed files:"
            printf '%s\n' "$changed"

            non_pkg=$(printf '%s\n' "$changed" | grep -vE '^(package\.json|package-lock\.json)$' || true)
            if [ -n "$changed" ] && [ -z "$non_pkg" ]; then
              echo "profile=smoke" >> "$GITHUB_OUTPUT"
              echo "Only package.json / package-lock.json changed — running smoke journey tests only"
              exit 0
            fi
          fi

          echo "profile=github" >> "$GITHUB_OUTPUT"
          echo "Running full github journey test suite"
      - run: docker build -t defradigital/marine-licensing-backend:${{github.sha}} .
      - uses: DEFRA/marine-licensing-journey-tests/run-journey-tests@main
        with:
          marine-licensing-backend: ${{github.sha}}
          branch: main
          profile: ${{ steps.journey-profile.outputs.profile }}
